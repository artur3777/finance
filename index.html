<style>
:root{
  --bg: var(--tg-theme-secondary-bg-color,#0e1014);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color,#171a21));
  --text: var(--tg-theme-text-color,#e9ebf1);
  --hint: var(--tg-theme-hint-color,#8a90a0);
  --link: var(--tg-theme-link-color,#5aa9ff);
  --btn: var(--tg-theme-button-color,#3b82f6);
  --btnt: var(--tg-theme-button-text-color,#fff);
  --sep: var(--tg-theme-section-separator-color, rgba(140,140,160,.18));
  --red: var(--tg-theme-destructive-text-color,#ef4444);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#view{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:18px 4px 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.hint{color:var(--hint);font-size:13px}
.small{font-size:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:18px;font-weight:600}
.pos{color:var(--green)} .neg{color:var(--text)} .red{color:var(--red)} .amber{color:var(--amber)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;background:var(--btn);color:var(--btnt);cursor:pointer;width:100%}
.btn.sec{background:color-mix(in srgb,var(--btn) 14%,transparent);color:var(--link)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--hint) 14%,transparent);font-size:13px;margin:0 6px 6px 0;cursor:pointer;border:1.5px solid transparent}
.chip.on{border-color:var(--btn);color:var(--link)}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep);cursor:pointer}
.list .it:last-child{border-bottom:0}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:11px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab b{font-size:20px;font-weight:400;line-height:1.1;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--link)} .tab.on b{filter:none;opacity:1}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.mnav button{border:0;background:var(--card);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer}
.mnav .t{font-weight:600;font-size:16px;text-transform:capitalize}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:10px}
.stat .v{font-weight:700;font-size:15px;margin-top:2px}
.bar{height:6px;border-radius:4px;background:color-mix(in srgb,var(--hint) 18%,transparent);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .pair i{width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.pill.due{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pill.late{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
input,select,textarea{font:inherit;color:var(--text);background:color-mix(in srgb,var(--hint) 12%,transparent);border:1px solid var(--sep);border-radius:10px;padding:10px;width:100%;outline:none}
select{appearance:auto}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--hint)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.filters select,.filters input{width:auto;min-width:110px;padding:8px;font-size:13px}
.day{display:flex;justify-content:space-between;color:var(--hint);font-size:13px;margin:14px 4px 6px}
.empty{text-align:center;color:var(--hint);padding:30px 10px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet h3{margin:0 0 6px;font-size:18px}
.x{float:right;border:0;background:color-mix(in srgb,var(--hint) 16%,transparent);color:var(--hint);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3)}
table.pv{width:100%;border-collapse:collapse;font-size:12px}
table.pv td{padding:4px 2px;border-bottom:1px solid var(--sep)}
.log{font:12px/1.4 ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--hint) 10%,transparent);border-radius:10px;padding:8px;max-height:180px;overflow:auto;white-space:pre-wrap;margin-top:8px}
.donut{display:flex;gap:14px;align-items:center}
.legend .lg{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
details summary{cursor:pointer;color:var(--link);font-size:13px;margin-top:8px}
a{color:var(--link)}
.hero{border-radius:20px;padding:16px;margin-bottom:10px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--btn) 70%,#a855f7) 0%,transparent 55%),linear-gradient(135deg,color-mix(in srgb,var(--btn) 85%,#000) 0%,color-mix(in srgb,var(--btn) 60%,#0f172a) 100%);box-shadow:0 8px 24px color-mix(in srgb,var(--btn) 25%,transparent)}
.hbtn{border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer}
.hchip{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;font-size:12px;margin:0 6px 6px 0}

.delta.up{color:#bbf7d0}.delta.dn{color:#fecaca}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.kpi{background:var(--card);border-radius:16px;padding:12px}
.kpi .lbl{font-size:12px;color:var(--hint)}
.kpi .val{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .sub{font-size:11px;color:var(--hint);font-weight:400;margin-top:2px}
h2.row{display:flex}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:2px;text-transform:none;letter-spacing:0}
.seg button{border:0;background:none;color:var(--hint);font:inherit;font-size:12px;padding:4px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnt)}
.dash{display:inline-block;width:16px;border-top:2px dashed var(--btn);vertical-align:middle}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--hint);margin-top:4px;padding:0 2px}
.xl span{flex:1;text-align:center}
.goal{cursor:pointer}
.datebox{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--btn) 14%,transparent);color:var(--link);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}

.nbars{display:flex;gap:8px;height:130px}
.nc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.nt i{width:60%;max-width:26px;border-radius:6px 6px 2px 2px;min-height:3px;display:block}

const Store = {
  dev(){ return ver('9.0') && tg.DeviceStorage ? tg.DeviceStorage : null; },
  load(){
    return new Promise(res => {
      let local = null; try { local = localStorage.getItem(KEY); } catch(e){}
      const d = this.dev();
      if (!d) return res(local);
      let done = false;
      const t = setTimeout(() => { if(!done){done=true;res(local);} }, 2500);
      d.getItem(KEY, (err, val) => {
        if (done) return; done = true; clearTimeout(t);
        const at = s => { try { return JSON.parse(s).savedAt || 0; } catch(e){ return -1; } };
        res(val && at(val) >= at(local) ? val : local);
      });
    });
  },
  save(str){
    try { localStorage.setItem(KEY, str); } catch(e){}
    const d = this.dev(); if (d) d.setItem(KEY, str, () => {});
  }
};

  get(){ return new Promise(res => {
    let l = ''; try { l = localStorage.getItem(TOKEN_KEY) || ''; } catch(e){}

function parseNum(v){

  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }

    else if (ch !== '\r') f += ch;

}

  }

}
function expUpTo(y, m, day){
  let s = 0;

}
let LAST_AVGNET = 0;
function forecast(){

  const recTot = S.recurring.reduce((s, r) => s + toUAH(r.amount, r.currency), 0);
  let recPaid = 0, recUnpaid = 0;
  for (const r of S.recurring) { const v = toUAH(r.amount, r.currency); if (recStatus(r, y, m).st === 'ok') recPaid += v; else recUnpaid += v; }
  const variable = Math.max(0, st.exp - recPaid);

  const histVar = hist.length ? Math.max(0, hist.reduce((s, h) => s + h.exp, 0) / hist.length - recTot) : null;
  const pace = d >= 5 || histVar == null ? variable / d : histVar / 30;
  const projInc = Math.max(st.inc, planInc);
  const endOfMonth = T.uah + (projInc - st.inc) - (pace * (D - d) + recUnpaid);

  else { avgNet = planInc - recTot - pace * 30; src = 'за планом і темпом витрат'; }

function goalProgress(g){
  const saved = g.accs && g.accs.length
    ? g.accs.reduce((s, id) => { const a = accById(id); return s + (a && a.balance != null ? conv(a.balance, a.currency, g.currency) : 0); }, 0)
    : (g.saved || 0);
  const pct = g.target > 0 ? Math.min(1, Math.max(0, saved / g.target)) : 0;
  const now = new Date(); let monthsLeft = 0, perMonth = 0, eta = '';
  if (g.deadline) { const [dy, dm] = g.deadline.split('-').map(Number); monthsLeft = Math.max(0, (dy - now.getFullYear()) * 12 + (dm - 1 - now.getMonth())); if (monthsLeft) perMonth = Math.max(0, (g.target - saved) / monthsLeft); }
  if (!monthsLeft && LAST_AVGNET > 0 && saved < g.target) {
    const k = Math.ceil((g.target - saved) / conv(LAST_AVGNET, 'UAH', g.currency));
    const e = new Date(now.getFullYear(), now.getMonth() + k, 1); eta = `≈ ${MONTHS[e.getMonth()]} ${e.getFullYear()}`;

}
function ring(p, color){

function lineChart(pts){
  const W = 320, H = 140, PX = 8, PT = 18, PB = 8;
  const vs = pts.map(p => p.v); let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mx - mn < 1) { mx += 1; mn -= 1; } const pd = (mx - mn) * 0.1; mn -= pd; mx += pd;
  const x = i => PX + (W - 2 * PX) * i / Math.max(1, pts.length - 1), y = v => PT + (H - PT - PB) * (1 - (v - mn) / (mx - mn));
  const P = pts.map((p, i) => ({...p, i}));

  const path = a => a.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = fact.length > 1 ? `${path(fact)}L${x(last.i).toFixed(1)},${H}L${x(fact[0].i).toFixed(1)},${H}Z` : '';
  const lbl = (p, anchor) => `<text x="${x(p.i).toFixed(1)}" y="${(y(p.v) - 7).toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="600" fill="currentColor">${kfmt(p.v)}</text>`;
  const endF = fc[fc.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;color:var(--text)">
    <defs><linearGradient id="lg1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--btn)" stop-opacity=".35"/><stop offset="1" stop-color="var(--btn)" stop-opacity="0"/></linearGradient></defs>
    ${[0.25, 0.5, 0.75].map(k => `<line x1="0" x2="${W}" y1="${PT + (H-PT-PB)*k}" y2="${PT + (H-PT-PB)*k}" stroke="var(--sep)" stroke-width="1"/>`).join('')}
    ${area ? `<path d="${area}" fill="url(#lg1)"/>` : ''}
    <path d="${path(fact)}" fill="none" stroke="var(--btn)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${fc.length > 1 ? `<path d="${path(fc)}" fill="none" stroke="var(--btn)" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>` : ''}
    ${last ? `<circle cx="${x(last.i)}" cy="${y(last.v)}" r="4.5" fill="var(--btn)" stroke="var(--card)" stroke-width="2"/>${lbl(last, fc.length > 1 ? 'middle' : 'end')}` : ''}

  </svg>

}
function upcomingPayments(days){
  const today = new Date(); today.setHours(0,0,0,0);
  const out = [];
  for (const r of S.recurring) for (let k = 0; k <= 1; k++) {
    const y = today.getFullYear(), m = today.getMonth() + k, d = new Date(y, m, 1);
    const yy = d.getFullYear(), mm = d.getMonth();
    const due = new Date(yy, mm, Math.min(r.day, dim(yy, mm)));
    const dd = Math.round((due - today) / 864e5);
    if (dd < 0 || dd > days) continue;
    if (recStatus(r, yy, mm).st === 'ok') continue;
    out.push({r, date: due, days: dd});
  }
  return out.sort((a, b) => a.days - b.days);
}

    <div class="row between" style="padding:10px 0"><span class="hint small">Разом за 10 днів</span><b>${money(upcoming.reduce((s,u)=>s+toUAH(u.r.amount,u.r.currency),0))}</b></div></div>` : ''}

  ${monthNav()}
  <div class="card">
    <div class="row between"><div><div class="hint small">Доходи</div><div class="mid pos">${money(st.inc)}</div></div><div style="text-align:right"><div class="hint small">Витрати</div><div class="mid">${money(st.exp)}</div></div></div>
    <div class="bar" style="height:8px;margin-top:10px"><i style="width:${st.inc > 0 ? Math.min(100, st.exp / st.inc * 100) : (st.exp ? 100 : 0)}%;background:${st.exp > st.inc ? 'var(--red)' : 'var(--amber)'}"></i></div>
    <div class="small hint" style="margin-top:6px">${st.inc > 0 ? `Витрачено ${Math.round(st.exp / st.inc * 100)}% доходів` : ''}${pace != null ? ` · ${pace > 0 ? '▲' : '▼'} ${Math.abs(Math.round(pace * 100))}% проти ${MONTHS_GEN2[pm]} на ${day}-те число` : ''}</div>
  </div>

  <h2>На що йдуть кошти</h2>
  <div class="card">${top.length ? `<div class="donut">${donut(top, expTotal)}<div class="legend grow">${top.map(x => `<div class="lg" onclick="${x.n==='Решта'?'':`UI.f={acc:'',cat:'${qEsc(x.n)}',q:'',type:'',all:false};go('tx')`}"><span class="dot" style="background:${x.c}"></span><span class="grow ellip small">${esc(x.n)}</span><span class="small"><b>${money(x.v)}</b> <span class="hint">${Math.round(x.v/expTotal*100)}%</span></span></div>`).join('')}</div></div>` : `<div class="empty">Немає витрат за цей місяць</div>`}</div>

  <h2>Заощадження по місяцях</h2>
  <div class="card"><div class="nbars">${nb.map(x => `<div class="nc" onclick="UI.y=${x.y};UI.m=${x.m};render()"><div class="nv small ${x.v<0?'red':'pos'}">${x.v ? (x.v > 0 ? '+' : '−') + kfmt(Math.abs(x.v)) : '0'}</div><div class="nt"><i style="height:${Math.abs(x.v)/nmx*100}%;background:${x.v<0?'var(--red)':'var(--green)'};${x.y===UI.y&&x.m===UI.m?'':'opacity:.55'}"></i></div><span class="hint small">${MSHORT[x.m]}</span></div>`).join('')}</div></div>
  ${recBlock()}`;
},

tx(){
  const f = UI.f;
  let list = S.tx.filter(t =>
    (f.all || inMonth(t, UI.y, UI.m)) && (!f.acc || t.acc === f.acc) && (!f.cat || t.cat === f.cat) &&
    (!f.type || (f.type === 'exp' ? (t.amount < 0 && catKind(t.cat) === 'exp') : f.type === 'inc' ? catKind(t.cat) === 'inc' : catKind(t.cat) === 'tr')) &&
    (!f.q || (t.desc + ' ' + (t.note || '')).toLowerCase().includes(f.q.toLowerCase())));
  list.sort((a, b) => b.date.localeCompare(a.date));
  const sum = list.reduce((s, t) => s + (catKind(t.cat) === 'tr' ? 0 : toUAH(t.amount, t.currency)), 0);
  const shown = list.slice(0, UI.limit);
  const today = isoLocal(new Date()).slice(0, 10), yest = isoLocal(new Date(Date.now() - 864e5)).slice(0, 10);
  let html = '', lastDay = '';
  const dayTot = {}; for (const t of list) { const d = t.date.slice(0,10); if (catKind(t.cat) !== 'tr') dayTot[d] = (dayTot[d] || 0) + toUAH(t.amount, t.currency); }
  for (const t of shown) {
    const d = t.date.slice(0, 10);
    if (d !== lastDay) {
      if (lastDay) html += `</div>`;
      const lbl = d === today ? 'Сьогодні' : d === yest ? 'Вчора' : new Date(d + 'T12:00').toLocaleDateString('uk-UA', {day:'numeric', month:'long', weekday:'short'});
      html += `<div class="day"><span>${lbl}</span><span>${money(dayTot[d] || 0)}</span></div><div class="card list" style="padding:2px 14px">`;
      lastDay = d;
    }
    html += txRow(t);
  }
  if (lastDay) html += `</div>`;
  const accOpts = S.accounts.map(a => `<option value="${a.id}" ${f.acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const catOpts = allCats().map(c => `<option ${f.cat===c.n?'selected':''}>${esc(c.n)}</option>`).join('');
  return `${f.all ? '' : monthNav()}
  <div class="filters">
    <input placeholder="🔍 Пошук" value="${esc(f.q)}" onchange="UI.f.q=this.value;render()">
    <select onchange="UI.f.type=this.value;render()"><option value="">Усі типи</option><option value="exp" ${f.type==='exp'?'selected':''}>Витрати</option><option value="inc" ${f.type==='inc'?'selected':''}>Доходи</option><option value="tr" ${f.type==='tr'?'selected':''}>Перекази між своїми</option></select>
    <select onchange="UI.f.acc=this.value;render()"><option value="">Усі рахунки</option>${accOpts}</select>
    <select onchange="UI.f.cat=this.value;render()"><option value="">Усі категорії</option>${catOpts}</select>
    <select onchange="UI.f.all=this.value==='1';render()"><option value="0">Місяць</option><option value="1" ${f.all?'selected':''}>Увесь час</option></select>
  </div>
  <div class="row between" style="margin:0 4px 4px"><span class="hint small">${list.length} операцій · підсумок ${money(sum)}</span><button class="btn sm sec" onclick="txSheet()">＋ Операція</button></div>
  ${html || '<div class="empty">Операцій не знайдено.<br>Завантажте виписку у вкладці «Рахунки».</div>'}
  ${list.length > UI.limit ? `<button class="btn sec" onclick="UI.limit+=300;render()">Показати ще (${list.length - UI.limit})</button>` : ''}`;
},

rec(){
  const total = S.recurring.reduce((s, r) => s + toUAH(Math.abs(r.amount), r.currency), 0);
  return `${monthNav()}${recBlock(true)}
  <div class="card"><div class="row between"><span class="hint">Разом обов'язкових на місяць</span><b>${money(total)}</b></div></div>
  <button class="btn" onclick="recSheet()">＋ Додати повторюваний платіж</button>
  <p class="hint small" style="margin:10px 4px">Платіж позначається оплаченим автоматично, якщо у виписці знайдено списання на ту ж суму (±3%) у межах ±5 днів від дати, або операцію з ключовим словом. Можна позначити вручну.</p>`;
},

acc(){
  const T = totals();
  const groups = {};
  S.accounts.forEach(a => (groups[a.bank] ||= []).push(a));
  const blocks = Object.entries(groups).map(([b, list]) => `<h2>${BANKS[b]?.i || '🏦'} ${BANKS[b]?.n || b}</h2><div class="card list" style="padding:2px 14px">${list.map(a => {
    const last = S.tx.filter(t => t.acc === a.id).reduce((m, t) => t.date > m ? t.date : m, '');
    const n = S.tx.filter(t => t.acc === a.id).length;
    return `<div class="it" onclick="accSheet('${a.id}')"><div class="grow"><div class="ellip">${esc(a.name)} ${a.inTotal===false?'<span class="hint small">(не в сумі)</span>':''}</div><div class="hint small">${n} операцій${last ? ' · остання ' + last.slice(0,10).split('-').reverse().join('.') : ''}${a.balanceDate ? ' · залишок на ' + a.balanceDate.slice(0,10).split('-').reverse().join('.') : ''}</div></div>
      <div class="amt">${money(a.balance, a.currency, true)}${a.currency !== 'UAH' && a.balance != null ? `<div class="hint small">${money(toUAH(a.balance, a.currency))}</div>` : ''}</div></div>`;
  }).join('')}</div>`).join('');
  return `<div class="card"><div class="hint">Разом на рахунках</div><div class="big">${money(T.uah)}</div><div class="hint">≈ ${money(T.uah / (rate('USD')||1), 'USD')} · ≈ ${money(T.uah / (rate('EUR')||1), 'EUR')}</div></div>
  <div class="btns"><button class="btn" onclick="$('#fileIn').click()">📥 Імпорт виписки</button><button class="btn sec" onclick="monoSheet()">🐈‍⬛ Monobank</button></div>
  <div class="btns"><button class="btn sec" onclick="accSheet()">＋ Рахунок</button></div>
  ${blocks || '<div class="empty">Рахунків ще немає</div>'}
  <h2>Як вивантажити виписку</h2>
  <div class="card small">
    <p style="margin-top:0"><b>Приват24:</b> Картки → обрати картку → Виписка → період → завантажити Excel або CSV. Можна одразу всі картки — застосунок розкладе їх по окремих рахунках.</p>
    <p><b>Monobank:</b> у застосунку відкрити картку → Виписка → обрати період → CSV/Excel. Або підключити API кнопкою вище — тоді операції підтягуються самі.</p>
    <p style="margin-bottom:0"><b>Payoneer:</b> Activity → Transactions → обрати період → Download (CSV). Кожна валюта стане окремим рахунком.</p>
  </div>`;
},

more(){
  const r = S.rates;
  const rules = S.rules.map((x, i) => `<div class="it"><div class="grow ellip">«${esc(x.match)}» → ${catInfo(x.cat).i} ${esc(x.cat)}</div><button class="btn sm danger" onclick="S.rules.splice(${i},1);save();render()">✕</button></div>`).join('');
  return `<h2>План</h2><div class="card"><button class="btn sec" onclick="planSheet()">🎯 Доходи і ціль заощаджень</button></div>
  <h2>Курси валют (грн)</h2>
  <div class="card">
    ${['USD','EUR','PLN','GBP'].map(c => `<div class="row" style="margin-bottom:8px"><span style="width:50px">${c}</span><input type="number" step="0.01" value="${r[c] || ''}" onchange="S.rates['${c}']=parseFloat(this.value)||0;S.rates.manual=true;save()"></div>`).join('')}
    <div class="hint small">${r.at ? 'Оновлено з НБУ: ' + new Date(r.at).toLocaleString('uk-UA') : 'Ще не оновлювалось'}${r.manual ? ' · змінено вручну' : ''}</div>
    <div class="btns"><button class="btn sec" onclick="S.rates.manual=false;updateRates(true)">Оновити з НБУ</button></div>
  </div>
  <h2>Правила категорій</h2>
  <div class="card list" style="padding:2px 14px">${rules || '<div class="hint" style="padding:12px 0">Правила створюються, коли змінюєте категорію операції з галочкою «застосувати до схожих».</div>'}</div>
  <div class="btns"><button class="btn sec" onclick="recategorize()">Перерахувати категорії</button><button class="btn sec" onclick="catAddSheet()">＋ Категорія</button></div>
  <h2>Резервна копія та синхронізація</h2>
  <div class="card">
    <div class="hint small">Дані зберігаються на цьому пристрої${Store.dev() ? ' (сховище Telegram)' : ''}. Хмара Telegram дозволяє відкрити ті самі дані на телефоні й комп'ютері.</div>
    ${ver('6.9') ? `<div class="btns"><button class="btn sec" onclick="cloudSave()">☁️ Зберегти в хмару</button><button class="btn sec" onclick="cloudLoad()">⬇️ З хмари</button></div>` : ''}
    <div class="btns"><button class="btn sec" onclick="exportBackup()">💾 Експорт JSON</button><button class="btn sec" onclick="$('#jsonIn').click()">📂 Імпорт JSON</button></div>
    <div class="btns"><button class="btn sec" onclick="exportCSV()">📄 Операції в CSV</button></div>
  </div>
  <h2>Небезпечна зона</h2>
  <div class="card"><button class="btn danger" onclick="wipe()">Видалити всі дані</button></div>
  <p class="hint small" style="text-align:center">${S.tx.length} операцій · ${S.accounts.length} рахунків · v1</p>`;
}
};

function txRow(t){
  const c = catInfo(t.cat), a = accById(t.acc);
  const op = t.opCurrency && t.opCurrency !== t.currency && t.opAmount ? `<div class="hint small">${money(t.opAmount, t.opCurrency, true)}</div>` : '';
  const tr = catKind(t.cat) === 'tr';
  return `<div class="it" onclick="txSheet('${t.id}')"><div class="ico" style="background:${c.c}22">${c.i}</div>
    <div class="grow"><div class="ellip">${esc(t.desc || '(без опису)')}</div><div class="hint small ellip">${esc(t.cat)} · ${esc(a ? a.name : '?')}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
    <div class="amt ${t.amount > 0 && !tr ? 'pos' : tr ? 'hint' : ''}">${t.amount > 0 ? '+' : ''}${money(t.amount, t.currency, true)}${op}</div></div>`;
}

function recBlock(full){
  const items = S.recurring.map(r => ({r, s: recStatus(r, UI.y, UI.m)})).sort((a, b) => a.r.day - b.r.day);
  if (!items.length) return full ? '<div class="empty">Немає повторюваних платежів</div>' : '';
  const left = items.filter(x => x.s.st !== 'ok').reduce((s, x) => s + toUAH(Math.abs(x.r.amount), x.r.currency), 0);
  return `<h2>Повторювані платежі · ${MONTHS[UI.m]}</h2><div class="card list" style="padding:2px 14px">
    ${items.map(({r, s}) => `<div class="it" onclick="recSheet('${r.id}')"><div class="ico" style="background:${catInfo(r.cat).c}22">${catInfo(r.cat).i}</div>
      <div class="grow"><div class="ellip">${esc(r.name)}</div><div class="hint small">${r.day} числа · ${esc(r.cat)}</div></div>
      <div class="amt">${money(r.amount, r.currency)}<div>${s.st === 'ok' ? '<span class="pill ok">оплачено</span>' : s.st === 'late' ? '<span class="pill late">прострочено</span>' : `<span class="pill due">${s.days === 0 ? 'сьогодні' : 'через ' + s.days + ' дн'}</span>`}</div></div></div>`).join('')}
    <div class="row between" style="padding:10px 0"><span class="hint small">Ще сплатити цього місяця</span><b>${money(left)}</b></div></div>`;
}

/* ============ Sheets ============ */
function openSheet(html){
  closeSheet(true);
  const bg = document.createElement('div'); bg.className = 'sheetbg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet"><button class="x" onclick="closeSheet()">✕</button>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg && !SHEET_LOCK) closeSheet(); });
  document.body.appendChild(bg);
  if (ver('6.1')) { tg.BackButton.show(); }
}
let SHEET_LOCK = false;
function closeSheet(silent){
  const s = $('#sheet'); if (s) s.remove();
  if (!silent && ver('6.1')) tg.BackButton.hide();
}
if (inTG && ver('6.1')) tg.BackButton.onClick(() => { if (!SHEET_LOCK) closeSheet(); });

function catSelect(sel, id='f_cat'){
  return `<select id="${id}">${allCats().map(c => `<option ${c.n===sel?'selected':''}>${esc(c.n)}</option>`).join('')}</select>`;
}
function accSelect(sel, id='f_acc'){
  return `<select id="${id}">${S.accounts.map(a => `<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} (${a.currency})</option>`).join('')}</select>`;
}
function simplify(desc){
  return String(desc || '').toLowerCase().replace(/[0-9*#№]+/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
}

function txSheet(id){
  const t = id ? S.tx.find(x => x.id === id) : null;
  if (!t && !S.accounts.length) { toast('Спершу додайте рахунок'); return accSheet(); }
  if (t) {
    const a = accById(t.acc);
    openSheet(`<h3>${esc(t.desc || 'Операція')}</h3>
      <div class="big ${t.amount>0?'pos':''}" style="font-size:26px">${t.amount>0?'+':''}${money(t.amount, t.currency, true)}</div>
      <div class="hint small">${t.date.replace('T',' ').slice(0,16).split(' ').map((p,i)=>i?p:p.split('-').reverse().join('.')).join(' ')} · ${esc(a ? a.name : '')}${t.mcc ? ' · MCC ' + t.mcc : ''}${t.opCurrency && t.opCurrency !== t.currency ? ' · ' + money(t.opAmount, t.opCurrency, true) : ''}${t.bankCat ? ' · ' + esc(t.bankCat) : ''}</div>
      <label class="f">Категорія</label>${catSelect(t.cat)}
      <label class="f"><input type="checkbox" id="f_all" style="width:auto"> Застосувати до всіх схожих (ключове слово):</label>
      <input id="f_kw" value="${esc(simplify(t.desc))}">
      <label class="f">Нотатка</label><input id="f_note" value="${esc(t.note || '')}">
      <div class="btns"><button class="btn" onclick="saveTx('${t.id}')">Зберегти</button></div>
      <div class="btns"><button class="btn danger" onclick="delTx('${t.id}')">Видалити операцію</button></div>`);
  } else {
    openSheet(`<h3>Нова операція</h3>
      <div class="btns" style="margin-top:0"><button class="btn sm sec" id="b_exp" onclick="this.className='btn sm';$('#b_inc').className='btn sm sec';window._sgn=-1">Витрата</button><button class="btn sm sec" id="b_inc" onclick="this.className='btn sm';$('#b_exp').className='btn sm sec';window._sgn=1">Дохід</button></div>
      <label class="f">Сума</label><input id="f_amt" type="number" step="0.01" inputmode="decimal">
      <label class="f">Рахунок</label>${accSelect(S.accounts[0].id)}
      <label class="f">Категорія</label>${catSelect('Інше')}
      <label class="f">Опис</label><input id="f_desc">
      <label class="f">Дата</label><input id="f_date" type="datetime-local" value="${isoLocal(new Date()).slice(0,16)}">
      <label class="f"><input type="checkbox" id="f_bal" checked style="width:auto"> Змінити залишок рахунку</label>
      <div class="btns"><button class="btn" onclick="addTx()">Додати</button></div>`);
    window._sgn = -1; $('#b_exp').className = 'btn sm';
  }
}
function saveTx(id){
  const t = S.tx.find(x => x.id === id); if (!t) return;
  const cat = $('#f_cat').value; t.note = $('#f_note').value.trim();
  t.cat = cat; t.locked = true;
  if ($('#f_all').checked) {
    const kw = $('#f_kw').value.trim().toLowerCase();
    if (kw.length >= 3) {
      S.rules = S.rules.filter(r => r.match !== kw);
      S.rules.unshift({match: kw, cat, sign: catKind(cat) === 'inc' ? 1 : catKind(cat) === 'exp' ? -1 : 0});
      let n = 0; for (const x of S.tx) if (x.desc.toLowerCase().includes(kw) && (catKind(cat) !== 'exp' || x.amount < 0) && (catKind(cat) !== 'inc' || x.amount > 0)) { x.cat = cat; n++; }
      toast(`Правило створено, оновлено ${n} операцій`);
    } else toast('Ключове слово занадто коротке');
  }
  save(); closeSheet(); render(); haptic('medium');
}
async function delTx(id){
  if (!(await ask('Видалити цю операцію?'))) return;
  S.tx = S.tx.filter(x => x.id !== id); save(); closeSheet(); render();
}
function addTx(){
  const a = parseFloat($('#f_amt').value); if (!a) return toast('Вкажіть суму');
  const acc = accById($('#f_acc').value);
  const amount = Math.abs(a) * window._sgn;
  const date = ($('#f_date').value || isoLocal(new Date()).slice(0,16)) + ':00';
  S.tx.push({id: 'u_' + uid(), acc: acc.id, date, amount, currency: acc.currency, desc: $('#f_desc').value.trim(), cat: $('#f_cat').value, src: 'manual', locked: true});
  if ($('#f_bal').checked && acc.balance != null) acc.balance = Math.round((acc.balance + amount) * 100) / 100;
  else if ($('#f_bal').checked) acc.balance = amount;
  save(); closeSheet(); render(); haptic('medium');
}

function accSheet(id){
  const a = id ? accById(id) : null;
  openSheet(`<h3>${a ? 'Рахунок' : 'Новий рахунок'}</h3>
    <label class="f">Назва</label><input id="a_name" value="${esc(a ? a.name : '')}" placeholder="Напр. Приват Універсальна">
    <label class="f">Банк</label><select id="a_bank">${Object.entries(BANKS).map(([k, b]) => `<option value="${k}" ${a && a.bank===k?'selected':''}>${b.i} ${b.n}</option>`).join('')}</select>
    <label class="f">Валюта</label><select id="a_cur">${['UAH','USD','EUR','PLN','GBP'].map(c => `<option ${a && a.currency===c?'selected':''}>${c}</option>`).join('')}</select>
    <label class="f">Поточний залишок</label><input id="a_bal" type="number" step="0.01" inputmode="decimal" value="${a && a.balance != null ? a.balance : ''}">
    <label class="f"><input type="checkbox" id="a_in" ${!a || a.inTotal !== false ? 'checked' : ''} style="width:auto"> Враховувати в загальному капіталі</label>

/* ============ Import ============ */
let IMP = null;
async function onFiles(files){
  if (!files || !files.length) return;
  const list = [];
  for (const f of files) {
    try {
      const rows = await readRows(f);
      const {hi, map} = detectHeader(rows);
      list.push({name: f.name, rows, hi, map, bank: guessBank(rows[hi] || [], f.name), invert: false, targets: {}});
    } catch(e) { toast(`${f.name}: ${e.message}`); }
  }
  if (!list.length) return;
  IMP = {files: list, idx: 0};
  impSheet();
}
function impGroups(F){
  const recs = extract(F.rows, F.hi, F.map, F.invert);
  const groups = {};
  for (const r of recs) {
    const card = r.card ? r.card.replace(/\D/g, '').slice(-4) || r.card.slice(-8) : '';
    const k = card + '|' + (r.currency || '');
    (groups[k] ||= {card, currency: r.currency, recs: []}).recs.push(r);
  }
  return {recs, groups};
}
function impSheet(){
  const F = IMP.files[IMP.idx];
  const {recs, groups} = impGroups(F);
  const hdr = F.rows[F.hi] || [];
  const colOpts = (f) => `<option value="">—</option>` + hdr.map((h, i) => `<option value="${i}" ${F.map[f] === i ? 'selected' : ''}>${esc(String(h).slice(0, 40) || 'Колонка ' + (i+1))}</option>`).join('');
  const sel = f => `<label class="f">${FIELD_LABELS[f]}</label><select onchange="impMap('${f}',this.value)">${colOpts(f)}</select>`;
  const dates = recs.map(r => r.date).sort();
  const gk = Object.keys(groups);
  const bankName = BANKS[F.bank]?.n || 'Рахунок';
  const groupHtml = gk.map(k => {
    const g = groups[k];
    const cur = g.currency || 'UAH';
    const ik = F.bank + '|' + g.card + '|' + cur;
    if (!(k in F.targets)) {
      const ex = S.accounts.find(a => a.importKey === ik) || S.accounts.find(a => a.bank === F.bank && a.currency === cur && (!g.card || (a.name || '').includes(g.card)));
      F.targets[k] = ex ? ex.id : 'new';
    }
    const opts = S.accounts.filter(a => a.currency === cur).map(a => `<option value="${a.id}" ${F.targets[k] === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
    return `<div class="row" style="margin-top:8px"><div class="grow small"><b>${g.card ? '•' + esc(g.card) + ' ' : ''}${cur}</b> <span class="hint">· ${g.recs.length} оп.</span></div>
      <select style="width:58%" onchange="IMP.files[IMP.idx].targets['${k}']=this.value"><option value="new" ${F.targets[k]==='new'?'selected':''}>＋ Новий: ${esc(bankName)} ${g.card ? '•' + esc(g.card) : ''} ${cur}</option>${opts}</select></div>`;
  }).join('');
  const needCur = gk.some(k => !groups[k].currency);
  openSheet(`<h3>Імпорт ${IMP.files.length > 1 ? `(${IMP.idx + 1}/${IMP.files.length})` : ''}</h3>
    <div class="hint small ellip">📄 ${esc(F.name)}</div>
    <div class="card" style="margin-top:10px">
      ${recs.length ? `<div class="mid">${recs.length} операцій</div><div class="hint small">${dates[0].slice(0,10).split('-').reverse().join('.')} — ${dates[dates.length-1].slice(0,10).split('-').reverse().join('.')}</div>` : `<div class="red">Не вдалося розпізнати операції. Перевірте колонки нижче.</div>`}
    </div>
    <label class="f">Банк</label><select onchange="IMP.files[IMP.idx].bank=this.value;IMP.files[IMP.idx].targets={};impSheet()">${Object.entries(BANKS).map(([k, b]) => `<option value="${k}" ${F.bank===k?'selected':''}>${b.i} ${b.n}</option>`).join('')}</select>
    ${needCur ? `<label class="f">Валюта рахунку (у файлі не вказана)</label><select onchange="impCur(this.value)"><option value="">—</option>${['UAH','USD','EUR','PLN'].map(c => `<option>${c}</option>`).join('')}</select>` : ''}
    ${gk.length ? `<label class="f">Куди записати</label>${groupHtml}` : ''}
    ${recs.length ? `<label class="f">Перші операції</label><table class="pv">${recs.slice(0, 5).map(r => `<tr><td>${r.date.slice(0,10).split('-').reverse().join('.')}</td><td class="ellip" style="max-width:150px">${esc(r.desc)}</td><td style="text-align:right;white-space:nowrap">${money(r.amount, r.currency || 'UAH', true)}</td></tr>`).join('')}</table>` : ''}
    <details ${recs.length ? '' : 'open'}><summary>Налаштувати колонки</summary>
      <label class="f">Рядок із заголовками</label><input type="number" min="1" value="${F.hi + 1}" onchange="impHeader(this.value)">
      ${['date','time','tz','desc','amount','currency','balance','card','credit','debit','mcc','bankCat','status','opAmount','opCurrency'].map(sel).join('')}
      <label class="f"><input type="checkbox" style="width:auto" ${F.invert ? 'checked' : ''} onchange="IMP.files[IMP.idx].invert=this.checked;impSheet()"> Змінити знак усіх сум</label>
    </details>
    <div class="btns"><button class="btn" ${recs.length ? '' : 'disabled style="opacity:.5"'} onclick="doImport()">Імпортувати</button></div>
    ${IMP.files.length > 1 ? `<div class="btns"><button class="btn sec" onclick="nextImport()">Пропустити файл</button></div>` : ''}`);
}
function impMap(f, v){ const F = IMP.files[IMP.idx]; if (v === '') delete F.map[f]; else F.map[f] = +v; F.targets = {}; impSheet(); }
function impHeader(v){ const F = IMP.files[IMP.idx]; F.hi = Math.max(0, (+v || 1) - 1); F.map = mapHeader((F.rows[F.hi] || []).map(String)); F.targets = {}; impSheet(); }
function impCur(c){ const F = IMP.files[IMP.idx]; F.forceCur = c; F.targets = {}; impSheet(); }
function nextImport(){ IMP.idx++; if (IMP.idx < IMP.files.length) impSheet(); else { IMP = null; closeSheet(); render(); } }
function doImport(){
  const F = IMP.files[IMP.idx];
  const {groups} = impGroups(F);
  const ids = new Set(S.tx.map(t => t.id));
  const keys = new Set(S.tx.filter(t => t.src !== 'file').map(t => t.k));
  let added = 0, dup = 0;
  for (const k of Object.keys(groups)) {
    const g = groups[k];
    const cur = g.currency || F.forceCur || 'UAH';
    let acc = F.targets[k] && F.targets[k] !== 'new' ? accById(F.targets[k]) : null;
    if (!acc) {
      acc = {id: uid(), bank: F.bank, currency: cur, balance: null, balanceDate: null, inTotal: true,
        name: `${BANKS[F.bank]?.n || 'Рахунок'}${g.card ? ' •' + g.card : ''} ${cur}`.trim(), importKey: F.bank + '|' + g.card + '|' + cur};
      S.accounts.push(acc);
    } else if (!acc.importKey) acc.importKey = F.bank + '|' + g.card + '|' + cur;
    let latest = null;
    for (const r of g.recs) {
      const kk = acc.id + '|' + r.date.slice(0, 16) + '|' + r.amount.toFixed(2);
      const id = 'f_' + hash(kk + '|' + r.desc + '|' + (r.balance ?? ''));
      if (ids.has(id) || keys.has(kk)) { dup++; continue; }
      ids.add(id);
      S.tx.push({id, k: kk, acc: acc.id, date: r.date, amount: r.amount, currency: acc.currency, desc: r.desc,
        opAmount: r.opAmount, opCurrency: r.opCurrency, mcc: r.mcc, bankCat: r.bankCat, src: 'file',
        cat: autoCat(r.desc, r.amount, r.mcc, r.bankCat)});
      added++;
      if (r.balance != null && (!latest || r.date > latest.date)) latest = r;
    }
    if (latest && (!acc.balanceDate || latest.date >= acc.balanceDate)) { acc.balance = latest.balance; acc.balanceDate = latest.date; }
  }
  save(); haptic('medium');
  toast(`Додано ${added} операцій${dup ? `, пропущено дублікатів: ${dup}` : ''}`);
  nextImport();
}

/* ============ Monobank API ============ */
let MONO = {token:'', info:null, busy:false};
async function monoSheet(){
  MONO.token = MONO.token || await Secret.get();

  openSheet(`<h3>🐈‍⬛ Monobank API</h3>

    <label class="f">Токен</label><input id="m_tok" type="password" value="${esc(MONO.token)}" placeholder="u3AulkpZFI1lIuGsik6vuPsVWqN7GoWs6o_MO2sdf301">
    <label class="f">Завантажити історію за</label><select id="m_depth"><option value="1">останні 31 день</option><option value="2">2 місяці</option><option value="3">3 місяці</option><option value="6">6 місяців</option></select>
    ${accs.length ? `<p class="hint small">Вже підключено рахунків: ${accs.length}. Повторна синхронізація підтягне лише нові операції.</p>` : ''}
    <div class="btns"><button class="btn" id="m_go" onclick="monoStep1()">${accs.length ? 'Оновити рахунки й операції' : 'Підключити'}</button></div>

    <div class="log" id="m_log" style="display:none"></div>`);
}
function mlog(s){ const l = $('#m_log'); if (!l) return; l.style.display = 'block'; l.textContent += s + '\n'; l.scrollTop = 1e9; }
async function monoFetch(path){
  for (let attempt = 0; attempt < 2; attempt++) {
    let r;
    try { r = await fetch('https://api.monobank.ua' + path, {headers: {'X-Token': MONO.token}}); }
    catch(e) { throw new Error('Немає з’єднання з Monobank (мережа або браузер блокує запит). Скористайтесь імпортом CSV.'); }
    if (r.status === 429 && attempt === 0) { mlog('Ліміт запитів — чекаю 60 с…'); await countdown(61); continue; }
    if (r.status === 403 || r.status === 401) throw new Error('Невірний токен');
    if (!r.ok) throw new Error(`Monobank ${r.status}: ${(await r.text()).slice(0, 120)}`);
    return r.json();
  }
  throw new Error('Перевищено ліміт запитів, спробуйте за хвилину');
}
async function countdown(sec){
  for (let s = sec; s > 0; s--) { const b = $('#m_go'); if (b) b.textContent = `Зачекайте ${s} с (ліміт Monobank)…`; await sleep(1000); }
}
async function monoStep1(){
  if (MONO.busy) return;
  MONO.token = $('#m_tok').value.trim();
  if (!MONO.token) return toast('Вставте токен');
  const depth = +$('#m_depth').value;
  Secret.set(MONO.token);
  MONO.busy = true; SHEET_LOCK = true; $('#m_go').disabled = true;
  try {
    mlog('Отримую список рахунків…');
    const info = await monoFetch('/personal/client-info');
    MONO.info = info;
    mlog(`Вітаю, ${info.name || ''}! Рахунків: ${(info.accounts||[]).length}, банок: ${(info.jars||[]).length}`);
    for (const x of info.accounts || []) {
      const cur = CUR_NUM[x.currencyCode] || String(x.currencyCode);
      const last4 = (x.maskedPan && x.maskedPan[0] || '').slice(-4);
      let a = S.accounts.find(z => z.apiId === x.id);
      if (!a) {
        const plainKey = 'mono||' + cur;
        a = S.accounts.find(z => z.importKey === plainKey && !z.apiId) || null;
        if (!a) { a = {id: uid(), bank: 'mono', inTotal: true, importKey: S.accounts.some(z => z.importKey === plainKey) ? 'mono|' + last4 + '|' + cur : plainKey}; S.accounts.push(a); }
        a.apiId = x.id;
        a.name = `Mono ${MONO_TYPES[x.type] || x.type || ''}${last4 ? ' •' + last4 : ''} ${cur}`.replace(/\s+/g, ' ');
      }
      a.currency = cur; a.monoType = x.type;
      a.balance = Math.round((x.balance - (x.creditLimit || 0))) / 100;
      a.creditLimit = (x.creditLimit || 0) / 100;
      a.balanceDate = isoLocal(new Date());
    }
    for (const j of info.jars || []) {
      const cur = CUR_NUM[j.currencyCode] || 'UAH';
      let a = S.accounts.find(z => z.apiId === j.id);
      if (!a) { a = {id: uid(), bank: 'mono', inTotal: true, apiId: j.id, jar: true, importKey: 'jar|' + j.id}; S.accounts.push(a); }
      a.name = `🫙 ${j.title}`; a.currency = cur; a.balance = j.balance / 100; a.balanceDate = isoLocal(new Date());
    }
    save(); render();
    const cards = S.accounts.filter(a => a.apiId && !a.jar);
    $('#m_box').innerHTML = `<label class="f">Які рахунки синхронізувати (кожен запит — 1 хв)</label>` +
      cards.map(a => `<label class="row small" style="margin:6px 0"><input type="checkbox" class="m_ck" value="${a.id}" style="width:auto" ${a.balance || a.monoType === 'black' || a.lastSync ? 'checked' : ''}> <span class="grow">${esc(a.name)}</span><span>${money(a.balance, a.currency, true)}</span></label>`).join('') +
      `<div class="btns"><button class="btn" id="m_go2" onclick="monoStep2(${depth})">Завантажити операції</button></div>`;
    $('#m_go').style.display = 'none';
  } catch(e) { mlog('❌ ' + e.message); toast(e.message, 4000); $('#m_go').disabled = false; $('#m_go').textContent = 'Спробувати ще'; }
  MONO.busy = false; SHEET_LOCK = false;
}
async function monoStep2(depth){
  if (MONO.busy) return;
  const sel = [...document.querySelectorAll('.m_ck:checked')].map(c => accById(c.value)).filter(Boolean);
  if (!sel.length) return toast('Оберіть хоча б один рахунок');
  MONO.busy = true; SHEET_LOCK = true;
  const btn = $('#m_go2'); btn.disabled = true;
  const ids = new Set(S.tx.map(t => t.id)), keys = new Set(S.tx.filter(t => t.src !== 'api').map(t => t.k));
  const nowS = Math.floor(Date.now() / 1000), WIN = 2678400 - 3600;
  let first = true, total = 0;
  try {
    for (const a of sel) {
      const stop = a.lastSync ? a.lastSync - 3 * 86400 : nowS - depth * WIN;
      let to = nowS;
      mlog(`→ ${a.name}`);
      while (to > stop) {
        const from = Math.max(stop, to - WIN);
        if (!first) { mlog('  чекаю 60 с (ліміт Monobank)…'); await countdownBtn(btn, 61); }
        first = false;
        const items = await monoFetch(`/personal/statement/${a.apiId}/${from}/${to}`);
        let n = 0;
        for (const it of items) {
          const id = 'm_' + it.id;
          const date = isoLocal(new Date(it.time * 1000));
          const amount = it.amount / 100;
          const kk = a.id + '|' + date.slice(0, 16) + '|' + amount.toFixed(2);
          if (ids.has(id) || keys.has(kk)) continue;
          ids.add(id);
          const desc = (it.description || '').replace(/\n/g, ' ') + (it.comment ? ' — ' + it.comment : '');
          S.tx.push({id, k: kk, acc: a.id, date, amount, currency: a.currency, desc,
            opAmount: it.operationAmount / 100, opCurrency: CUR_NUM[it.currencyCode] || '', mcc: it.mcc || it.originalMcc || null,
            src: 'api', cat: autoCat(desc, amount, it.mcc || it.originalMcc, '')});
          n++;
        }
        total += n;
        mlog(`  ${new Date(from*1000).toLocaleDateString('uk-UA')}–${new Date(to*1000).toLocaleDateString('uk-UA')}: отримано ${items.length}, нових ${n}`);
        save();
        if (items.length >= 500) to = Math.min(...items.map(i => i.time)) - 1;
        else to = from;
      }
      a.lastSync = nowS; save();
    }
    mlog(`✅ Готово. Нових операцій: ${total}`);
    toast(`Monobank: додано ${total} операцій`); haptic('medium');
    btn.textContent = 'Готово'; render();
  } catch(e) { mlog('❌ ' + e.message); toast(e.message, 4000); btn.disabled = false; btn.textContent = 'Продовжити'; }
  MONO.busy = false; SHEET_LOCK = false;
}
async function countdownBtn(btn, sec){ for (let s = sec; s > 0; s--) { btn.textContent = `Наступний запит через ${s} с…`; await sleep(1000); } btn.textContent = 'Завантажую…'; }

/* ============ Rates ============ */
async function updateRates(force){
  if (S.rates.manual && !force) return;
  if (!force && Date.now() - (S.rates.at || 0) < 6 * 3600e3) return;
  try {
    const r = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
    const j = await r.json();
    for (const x of j) if (['USD','EUR','PLN','GBP','CZK','CHF'].includes(x.cc)) S.rates[x.cc] = x.rate;
    S.rates.at = Date.now(); S.rates.manual = false; save(); render();
    if (force) toast('Курси оновлено');
  } catch(e) { if (force) toast('Не вдалося отримати курси НБУ'); }
}

/* ============ Backup / cloud ============ */
function download(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportBackup(){
  const txt = JSON.stringify(S);
  download(`finance-backup-${isoLocal(new Date()).slice(0,10)}.json`, txt, 'application/json');
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Файл збережено і скопійовано в буфер'), () => {});
}
async function importBackup(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.tx || !data.accounts) throw new Error('bad');
    if (!(await ask(`Замінити поточні дані копією (${data.tx.length} операцій)?`))) return;
    S = Object.assign(defaults(), data); save(); render(); toast('Відновлено');
  } catch(e) { toast('Невірний файл резервної копії'); }
}
function exportCSV(){
  const rows = [['Дата','Рахунок','Валюта','Сума','Сума UAH','Категорія','Опис','Нотатка']];
  [...S.tx].sort((a,b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date.replace('T',' '), accById(t.acc)?.name || '', t.currency, t.amount, Math.round(toUAH(t.amount, t.currency)*100)/100, t.cat, t.desc, t.note || '']));
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  download(`transactions-${isoLocal(new Date()).slice(0,10)}.csv`, csv, 'text/csv');
}
const CS = () => tg.CloudStorage;
const csSet = (k, v) => new Promise((res, rej) => CS().setItem(k, v, (e, ok) => e ? rej(new Error(e)) : res(ok)));
const csGet = k => new Promise((res, rej) => CS().getItem(k, (e, v) => e ? rej(new Error(e)) : res(v)));
const csGetMany = ks => new Promise((res, rej) => CS().getItems(ks, (e, v) => e ? rej(new Error(e)) : res(v)));
async function cloudSave(){
  try {
    const str = JSON.stringify(S), N = 4000, n = Math.ceil(str.length / N);
    if (n > 1000) return toast('Забагато даних для хмари Telegram — використайте експорт JSON');
    toast('Зберігаю в хмару…');
    for (let i = 0; i < n; i += 20) await Promise.all(Array.from({length: Math.min(20, n - i)}, (_, j) => csSet('c' + (i + j), str.slice((i + j) * N, (i + j + 1) * N))));
    await csSet('meta', JSON.stringify({n, at: S.savedAt || Date.now()}));
    toast(`☁️ Збережено (${Math.round(str.length/1024)} КБ)`); haptic('medium');
  } catch(e) { toast('Помилка хмари: ' + e.message); }
}
async function cloudLoad(silentCheck){
  try {
    const meta = JSON.parse(await csGet('meta') || 'null');
    if (!meta) { if (!silentCheck) toast('У хмарі ще немає даних'); return; }
    if (silentCheck && meta.at <= (S.savedAt || 0)) return;
    if (!(await ask(`У хмарі Telegram є копія від ${new Date(meta.at).toLocaleString('uk-UA')}. Завантажити її замість даних на цьому пристрої?`))) return;
    let str = '';
    for (let i = 0; i < meta.n; i += 50) {
      const ks = Array.from({length: Math.min(50, meta.n - i)}, (_, j) => 'c' + (i + j));
      const v = await csGetMany(ks); str += ks.map(k => v[k] || '').join('');
    }
    S = Object.assign(defaults(), JSON.parse(str)); save(); render(); toast('Завантажено з хмари');
  } catch(e) { if (!silentCheck) toast('Помилка хмари: ' + e.message); }
}
async function wipe(){
  if (!(await ask('Точно видалити ВСІ дані з цього пристрою? Дію не можна скасувати.'))) return;
  S = defaults(); save(); render(); toast('Дані видалено');
}

/* ============ Init ============ */
async function init(){
  if (tg) { try { tg.ready(); tg.expand(); if (ver('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } if (ver('7.7')) tg.disableVerticalSwipes(); } catch(e){} }
  const raw = await Store.load();
  try { S = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults(); } catch(e) { S = defaults(); }
  render();
  updateRates();
  if (ver('6.9')) cloudLoad(true);
}
init();
